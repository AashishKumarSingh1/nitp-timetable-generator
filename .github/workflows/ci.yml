name: CI/CD Pipeline - Quality, Invariants & Deployment

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment Environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - preview

concurrency:
  group: pipeline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-and-build:
    name: TypeScript Check & Next.js Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Type Check (tsc)
        run: npx tsc --noEmit

      - name: Next.js Production Build
        run: npm run build
        env:
          NODE_ENV: production
          DATABASE_URL: 'mysql://root:rootpassword@127.0.0.1:3306/timetable_nitp'
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3306
          MYSQL_DATABASE: timetable_nitp
          MYSQL_USERNAME: root
          MYSQL_PASSWORD: rootpassword
          MYSQL_SSL: 'false'
          GOOGLE_CLIENT_ID: dummy_google_client_id_for_ci
          GOOGLE_CLIENT_SECRET: dummy_google_client_secret_for_ci
          JWT_SECRET: dummy_jwt_secret_for_ci_build_test_only_min_32_chars

  invariants-and-solver-test:
    name: MySQL Database & Timetable Solver Invariants
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: timetable_nitp
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Initialize Database Schema & Starter Entities
        run: npm run db:init
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3306
          MYSQL_DATABASE: timetable_nitp
          MYSQL_USERNAME: root
          MYSQL_PASSWORD: rootpassword
          MYSQL_SSL: 'false'
          DATABASE_URL: 'mysql://root:rootpassword@127.0.0.1:3306/timetable_nitp'
          JWT_SECRET: dummy_jwt_secret_for_ci_build_test_only_min_32_chars

      - name: Execute Full Timetable Solver & Anti-Cheating Invariant Suite
        run: npm run verify
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3306
          MYSQL_DATABASE: timetable_nitp
          MYSQL_USERNAME: root
          MYSQL_PASSWORD: rootpassword
          MYSQL_SSL: 'false'
          DATABASE_URL: 'mysql://root:rootpassword@127.0.0.1:3306/timetable_nitp'
          JWT_SECRET: dummy_jwt_secret_for_ci_build_test_only_min_32_chars

  deploy:
    name: Deploy to Vercel (Post-CI Gate)
    needs: [typecheck-and-build, invariants-and-solver-test]
    if: (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate Vercel Secrets
        id: check-secrets
        run: |
          MISSING=0
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "::warning::Missing GitHub Secret: VERCEL_TOKEN"
            MISSING=1
          fi
          if [ -z "${{ secrets.VERCEL_ORG_ID }}" ]; then
            echo "::warning::Missing GitHub Secret: VERCEL_ORG_ID"
            MISSING=1
          fi
          if [ -z "${{ secrets.VERCEL_PROJECT_ID }}" ]; then
            echo "::warning::Missing GitHub Secret: VERCEL_PROJECT_ID"
            MISSING=1
          fi

          if [ $MISSING -eq 1 ]; then
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "⚠️ Notice: Vercel secrets are not configured in this repository."
            echo "To enable direct GitHub Actions deployment to Vercel, please add the following secrets in GitHub Settings -> Secrets and variables -> Actions:"
            echo "  - VERCEL_TOKEN"
            echo "  - VERCEL_ORG_ID"
            echo "  - VERCEL_PROJECT_ID"
            echo "Note: If your repository is already linked directly to Vercel Git Integration, Vercel deploys automatically on push."
          else
            echo "configured=true" >> $GITHUB_OUTPUT
          fi

      - name: Install Vercel CLI
        if: steps.check-secrets.outputs.configured == 'true'
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Configuration
        if: steps.check-secrets.outputs.configured == 'true'
        run: |
          if [ "${{ github.event.inputs.environment }}" = "preview" ]; then
            vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
          else
            vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
          fi
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build Project Artifacts
        if: steps.check-secrets.outputs.configured == 'true'
        run: |
          if [ "${{ github.event.inputs.environment }}" = "preview" ]; then
            vercel build --token=${{ secrets.VERCEL_TOKEN }}
          else
            vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
          fi
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy to Vercel
        if: steps.check-secrets.outputs.configured == 'true'
        run: |
          if [ "${{ github.event.inputs.environment }}" = "preview" ]; then
            DEPLOY_URL=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          else
            DEPLOY_URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          fi
          echo "Deployed successfully to: $DEPLOY_URL"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
